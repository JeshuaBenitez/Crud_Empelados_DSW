name: 03 Cypress

on:
  repository_dispatch:
    types:
      - chain-cypress

permissions:
  contents: write

jobs:
  cypress-e2e:
    runs-on: ubuntu-latest
    if: ${{ github.event.client_payload.branch == 'deploy' }}
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Levantar PostgreSQL en Docker
        working-directory: .
        run: docker compose up -d postgres

      - name: Levantar API Backend en segundo plano
        working-directory: .
        run: mvn -f DSW02-Practica01/pom.xml spring-boot:run -Dspring-boot.run.arguments="--server.port=8081" &

      - name: Esperar a que la API esté lista
        working-directory: .
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:8081/api/v1/auth/empleados/login > /dev/null; then
              echo "¡La API está lista!"
              exit 0
            fi
            echo "Esperando a la API..."
            sleep 1
          done
          echo "La API no inició a tiempo"
          exit 1

      - name: Run Cypress E2E (start server + tests)
        uses: cypress-io/github-action@v5
        with:
          working-directory: frontend-angular
          start: npx ng serve --port 8088
          wait-on: 'http://localhost:8088'
          wait-on-timeout: 120000
          command: npx cypress run --spec cypress/e2e/auth/login.cy.ts --config baseUrl=http://localhost:8088

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend-angular/cypress/screenshots
          if-no-files-found: ignore

      - name: Disparar 04 Docker Hub
        if: ${{ success() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'chain-docker',
              client_payload: {
                sha: context.payload.client_payload.sha,
                branch: context.payload.client_payload.branch
              }
            });
