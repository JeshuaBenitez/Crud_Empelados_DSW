name: 03-Cypress

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

jobs:
  cypress-auth:
    name: Cypress Auth E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend-angular

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Start frontend app
        run: npm start > /tmp/ng-serve.log 2>&1 &

      - name: Wait for frontend app
        run: |
          for i in {1..60}; do
            if curl -sSf http://127.0.0.1:4200 >/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not start in time"
          cat /tmp/ng-serve.log
          exit 1

      - name: Run Cypress tests
        run: npm run cypress:run
