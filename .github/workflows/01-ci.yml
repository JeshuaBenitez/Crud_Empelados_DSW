name: 01-CI
# Trigger run comment

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: empleados_db
          POSTGRES_USER: empleados_user
          POSTGRES_PASSWORD: empleados_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U empleados_user -d empleados_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/empleados_db
      SPRING_DATASOURCE_USERNAME: empleados_user
      SPRING_DATASOURCE_PASSWORD: empleados_pass
      SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/empleados_db
      SPRING_FLYWAY_USER: empleados_user
      SPRING_FLYWAY_PASSWORD: empleados_pass
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f DSW02-Practica01/pom.xml test

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend tests
        run: npm run test -- --watch=false --no-progress

  dispatch-sonar:
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
    if: ${{ success() }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'chain-sonar',
              client_payload: {
                sha: context.sha,
                branch: context.ref.replace('refs/heads/', '')
              }
            });
