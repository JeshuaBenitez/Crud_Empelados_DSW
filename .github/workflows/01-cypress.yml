name: 01-Cypress

on:
  workflow_run:
    workflows:
      - CI 01
    types:
      - completed
  workflow_dispatch:

jobs:
  run-cypress:
    name: Run Cypress E2E
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code at triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend deps
        working-directory: frontend-angular
        run: npm ci

      - name: Build frontend for Docker
        working-directory: frontend-angular
        run: npm run build

      - name: Start stack for Cypress E2E
        run: docker compose up -d postgres api frontend

      - name: Wait for frontend to be ready
        run: |
          for i in {1..60}; do
            if curl -sSf http://localhost:4200 >/dev/null; then
              echo "Frontend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not start in time"
          docker compose logs frontend api postgres
          exit 1

      - name: Wait for backend to be ready
        run: |
          for i in {1..60}; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:8081/swagger-ui.html || true)
            if [[ "$status" == "200" ]]; then
              echo "Backend is ready (swagger-ui.html)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time"
          docker compose logs frontend api postgres
          exit 1

      - name: Run Cypress
        working-directory: frontend-angular
        run: npm run cypress:run:junit

      - name: Stop stack
        if: always()
        run: docker compose down -v

      - name: Create PR deploy->main if not exists
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'deploy';
            const base = 'main';
            const prs = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, base });
            if (prs.data.length === 0) {
              await github.rest.pulls.create({ owner, repo, head, base, title: 'Automated PR: deploy → main', body: 'Automated PR created by CI chain after Cypress success.' });
              console.log('Created PR from deploy to main');
            } else {
              console.log('PR already exists; skipping creation');
            }
