name: CI 01
# Workflow for CI testing backend and frontend

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f DSW02-Practica01/pom.xml test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend-angular
        run: npm run test -- --watch=false --no-progress

      - name: Start stack for Cypress E2E
        run: docker compose up -d postgres api frontend

      - name: Wait for frontend to be ready
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:4200 > /dev/null; then
              echo "Frontend disponible en localhost:4200"
              exit 0
            fi
            echo "Esperando frontend... intento $i/60"
            sleep 5
          done
          echo "Frontend no estuvo disponible a tiempo"
          docker compose logs frontend api postgres
          exit 1

      - name: Run Cypress E2E
        working-directory: frontend-angular
        run: npm run cypress:run:junit

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            frontend-angular/cypress/reports
            frontend-angular/cypress/screenshots
            frontend-angular/cypress/videos
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down -v
