name: CI 01

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        run: mvn -B -f DSW02-Practica01/pom.xml test
  # Frontend/Cypress moved to a dedicated workflow: 01-cypress.yml
